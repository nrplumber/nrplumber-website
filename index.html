<title>NR PLUMBER - Tukang Paip Profesional</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#f2f6ff;color:#111}
.topbar{background:#0a3d8a;color:#fff;text-align:center;padding:8px;font-size:13px;font-weight:bold}
.hero{position:relative;width:100%;height:340px;overflow:hidden;background:#0a3d8a}
.hero img.bg{width:100%;height:100%;object-fit:cover}
.hero-overlay{position:absolute;inset:0;background:linear-gradient(to right,rgba(255,255,255,.95) 0%,rgba(255,255,255,.85) 45%,rgba(255,255,255,0) 75%)}
.hero-content{position:absolute;inset:0;padding:16px;display:flex;flex-direction:column;justify-content:center}
.logo{width:72px;height:72px;border-radius:50%;background:#fff;border:3px solid #00a8ff;display:flex;align-items:center;justify-content:center;font-size:32px}
.hero h1{font-size:42px;line-height:.9;color:#0a2a6b}
.hero h1 span{font-size:15px;letter-spacing:2px;color:#0a3d8a}
.tag{font-style:italic;color:#0a3d8a;font-weight:bold;margin:6px 0 14px}
.svc-row{display:flex;gap:8px}
.svc{background:#fff;border-radius:12px;padding:8px 6px;width:62px;text-align:center;box-shadow:0 2px 6px rgba(0,0,0,.1)}
.svc small{font-size:9px;font-weight:bold}
.call-btn{position:absolute;top:14px;right:12px;background:#ff004e;color:#fff;padding:10px 16px;border-radius:30px;text-decoration:none;font-weight:bold;font-size:14px}
.btn-row{display:flex;gap:8px;padding:12px 10px;margin-top:-28px;position:relative;z-index:5}
.btn-row a{flex:1;text-align:center;padding:12px 5px;border-radius:12px;text-decoration:none;font-weight:bold;font-size:12px;box-shadow:0 3px 8px rgba(0,0,0,.15)}
.b-blue{background:#0a6bff;color:#fff}.b-green{background:#25D366;color:#fff}.b-white{background:#fff;color:#0a3d8a}.b-orange{background:#ff7a00;color:#fff}
